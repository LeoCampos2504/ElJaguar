# INTERNAL DEVELOPMENT ONLY.
# Builds a debug-signed APK of the CLIENT target for installing on the
# operator's own test phone. It is not the Google Play build and must never be
# distributed to EL JAGUAR clients or drivers. Uses no secrets.
name: EL JAGUAR Android Internal APK

on:
  push:
    branches:
      - work/el-jaguar-pilot-v1
  pull_request:
    branches:
      - work/el-jaguar-pilot-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-internal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Node and npm versions
        run: |
          node --version
          npm --version
          {
            echo "### EL JAGUAR Android internal build (internal development only)"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Node / npm | $(node --version) / $(npm --version) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          count() { grep -E "^ℹ $1 [0-9]+" "$RUNNER_TEMP/npm-test.log" | awk '{print $3}'; }
          echo "::notice title=Tests::tests=$(count tests) pass=$(count pass) fail=$(count fail)"
          echo "| Tests | $(count tests) run, $(count pass) pass, $(count fail) fail |" >> "$GITHUB_STEP_SUMMARY"

      # The presentation prototype must keep building, but it is never packaged.
      - name: Prototype reference build (TypeScript + Vite)
        run: |
          npm run build
          test -f dist/index.html

      # build:client = TypeScript + Vite in client mode + client bundle verification.
      # It runs last so dist/ holds only the CLIENT surface when Capacitor syncs.
      - name: Client build (Android surface)
        run: |
          npm run build:client
          grep -q '<title>EL JAGUAR</title>' dist/index.html
          echo "| Android surface | CLIENT_ONLY (bundle verified) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Capacitor sync Android
        run: |
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          grep -q '<title>EL JAGUAR</title>' android/app/src/main/assets/public/index.html
          echo "::notice title=Android surface::CLIENT_ONLY"

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Java version
        run: |
          java -version
          echo "| Java | $(java -version 2>&1 | head -1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK metadata
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          size=$(stat -c %s "$apk")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          gradle=$(cd android && ./gradlew --version --no-daemon | grep -m1 '^Gradle ' | cut -d' ' -f2)
          sdk=$(grep -E '(compile|target|min)SdkVersion' android/variables.gradle | tr -d ' ' | paste -sd ' ' -)
          java=$(java -version 2>&1 | head -1 | tr -d '"')
          echo "APK_PATH=$apk"
          echo "APK_SIZE=$size bytes"
          echo "APK_SHA256=$sha"
          echo "::notice title=Debug APK::app-debug.apk size=${size} sha256=${sha}"
          echo "::notice title=Toolchain::node=$(node --version) java=${java} gradle=${gradle} ${sdk}"
          {
            echo "| Gradle | $gradle |"
            echo "| Android SDK | $sdk |"
            echo "| APK path | \`$apk\` |"
            echo "| APK size | $size bytes |"
            echo "| APK SHA-256 | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: el-jaguar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
